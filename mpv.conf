autocreate-playlist=same
directory-filter-types=ts

# Limit resolution to 1080p
ytdl-format=bv*[height<=1080]+ba/b[height<=1080]

# Limit Reoslution to 1440p
#ytdl-format=bv*[height<=2560]+ba/b[height<=2560]

# Limit resolution to 4k
#ytdl-format=bv*[height<=3840]+ba/b[height<=3840]

# Fix the 360p issue: Force strict Resolution sorting.
# We use quotes "res,fps" so mpv doesn't break at the comma.
ytdl-raw-options=format-sort="res,fps"


#loop-file=inf

#prevent resume-playback
no-resume-playback

####################################
########  Subtitle Stuffs  #########
####################################

slang=en
no-sub-auto

# --- Subtitle Override ---
sub-ass-override=force
sub-font-provider=auto
#sub-font-provider=fontconfig

#sub-ass-override=strip
sub-auto=fuzzy

# --- Subtitle Style ---
sub-bold=yes
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=3
sub-shadow-offset=2
sub-spacing=0.4

# Force ASS/SSA subtitles to respect your margin settings
#sub-ass-force-margins=yes  #NOT working as intended
sub-pos=97

# Set the left and right margins (Horizontal) to 40
sub-margin-x=45

# Set the top and bottom margins (Vertical) to 20
#sub-margin-y=55

# This section addresses your specific request.
#loop-playlist=inf


####################################
#       --- Image Display ---      #
####################################

# Display images for a duration in seconds.
image-display-duration=5

####################################
#       --- Profiles ---           #
####################################

# Create a dedicated profile for animated images to loop them.
[gif-webp]
loop-file=inf
loop-playlist=inf

# Automatically apply the above profile to .gif and .webp files.
[extension.gif]
profile=gif-webp

[extension.webp]
profile=gif-webp

[extension.mp4]
loop-file=inf
loop-playlist=inf


# --- SWITCH BACK TO GLOBAL ---
#this swaps back out of current profile to global settings
[default]

####################################
#	  --- Window & Session ---	   #
####################################

#ontop=yes

# How the player window and playback session behaves.
save-position-on-quit=yes
# Keep window open after video finishes.
keep-open=yes
# Remove the window border.
border=no
# force starting with centered window
geometry=50%:50%
# don't allow a new window to have a size larger than 90% of the screen size
autofit-larger=90%x90%


################################################
# --- Subtitles & Audio Track Selection ---    #
################################################

# Select tracks by title metadata. The match is case-sensitive.
# track=audio:title=Jap
# track=subtitle:title=Eng

# Set preferred languages for properly tagged files (fallback).
slang=en,eng
alang=jp,jpn,ja,en,eng


# A clean, readable subtitle style: White text with a semi-transparent black border.
# sub-font-size=65
# sub-color="#FFFFFFFF"
# sub-border-color="#40000000" # RGBA format: (40=25% opacity, 000000=black)
# sub-border-size=5.5
# sub-shadow-offset=1
# sub-spacing=0.5
#sub-ass-override=force
#sub-font-provider=auto
#sub-use-margins=no
#sub-bold=yes
#sub-color="#FFFFFFFF"
#sub-border-color="#FF000000"   # solid black
#sub-border-size=5.5
#sub-shadow-offset=2
#sub-spacing=0.5

# --- Audio ---
# General audio settings.
# Allow volume to be boosted beyond 100%. 150 is a safe maximum.
volume-max=111

####################################
# On-Screen Controller (OSC) / UI  #
####################################

# Tweaks for the user interface that appears on mouse movement.
# Use a modern, slim style for the on-screen controller bar.
#script-opts=osc-layout=slimbox

# --- On-Screen Controller (OSC) Settings ---
# layout=slimbox reduces the vertical height significantly.
# hidetimeout=500 makes it disappear very quickly (half a second).
#script-opts=osc-layout=slimbox,osc-hidetimeout=500


########################
# --- Screenshots ---  #
########################

screenshot-format=png

# Save screenshots in a sub-folder named 'mpv' inside your Pictures directory.
# NOTE for Windows Users: Change this to something like:
screenshot-directory="d:\ProgramData\asus\"
#screenshot-directory=d:\ProgramData\asus
#screenshot-directory="d:/ProgramData?asus/"

####################################
#      --- Video & Quality ---     #
####################################

# Settings for high-quality video playback.
# Use a pre-configured set of high-quality options. This is a great starting
# point and sets many complex options (like scaling filters) automatically.
profile=high-quality
#profile=fast

# Hardware video decoding. 'auto-copy' is a safe and broadly compatible choice.
# It tries to use your GPU to decode video, which saves CPU, and copies the
# result back to system memory for filtering. This works on almost all hardware.
hwdec=auto-copy

# Use the modern GPU-based video output driver. the default on most systems now. 'gpu' is more stable.
vo=gpu
