# ============================================================
# Subtitle Font Size (Mirrors Google Notebook)
# ============================================================

# Font Size
Shift+g add sub-scale 0.1
Shift+f add sub-scale -0.1

# Font Color
Ctrl+1 set sub-color "#FFFFFF"
Ctrl+2 set sub-color "#FFFF00"
Ctrl+3 set sub-color "#00FFFF"
Ctrl+4 set sub-color "#000000"
Ctrl+5 set sub-color "#00FF00"

# Outline Size
Ctrl+o cycle-values sub-border-size 0 1 2 3 4 5

# Shadow Size
Ctrl+s cycle-values sub-shadow-offset 0 1 2 3

# Position
Ctrl+t set sub-pos 5
Ctrl+b set sub-pos 95

Alt+r add sub-pos -1
Alt+t add sub-pos +1

# Vertical Margin
Alt+UP add sub-margin-y 5
Alt+DOWN add sub-margin-y -5

# Horizontal Margin
Alt+RIGHT add sub-margin-x 10
Alt+LEFT add sub-margin-x -10

# ===================================================================
#               mpv Custom Input Configuration
# ===================================================================

# Lines starting with '#' are comments and are ignored by mpv.
# The format is: Key_Name command [arguments]

# --- Playback & Navigation ---

# A-B Loop (Set a start point 'A' and end point 'B' to loop a section)
l ab-loop            # Press once to set point A, press again to set point B and start looping
L cycle-values ab-loop "no" # Press Shift+L to clear the loop

# Toggle window border and title bar (for a cleaner look)
b cycle border

# Take a screenshot WITHOUT subtitles
S screenshot video


# --- Mouse Wheel Seeking ---
# Seek forward/backward by 1 second using the mouse wheel.
WHEEL_UP    seek 1
WHEEL_DOWN  seek -1


# --- Custom Seeking ---
# Skip forward/backward by 15 or 60 seconds.
r seek 15
t seek 60
e seek -15
w seek -60

UP seek 15
RIGHT seek 5
LEFT seek -5
DOWN seek -15

# --- Volume Control ---
# Adjust volume by 10%. Note: This overrides the default behavior of 9 and 0.
9 add volume -10
0 add volume 10


# --- Playback Control ---
SPACE     cycle pause
ENTER     playlist-next

# Frame stepping
. frame-step          # Go forward one frame
, frame-back-step     # Go backward one frame

# Playback speed
[ add speed -0.1      # Decrease speed by 10%
] add speed 0.1       # Increase speed by 10%

BS set speed 1.0   # Reset speed to normal (1.0)   BACKSPACE is giving an error

# --- Audio & Subtitles ---

# Cycle through available audio tracks
h cycle audio

# Cycle through available subtitle tracks
g cycle sub

# Toggle subtitle visibility
#v cycle sub-visibility

# Increase/decrease subtitle font size
#Ctrl+WHEEL_UP   add sub-scale 0.1
#Ctrl+WHEEL_DOWN add sub-scale -0.1

# Apply a simple sharpening filter to the video (can make low-res video look clearer)
# Pressing it again will remove the filter.

#u cycle-values vf "unsharp=luma_msize_x=7:luma_msize_y=7:luma_amount=1.0" ""

# Toggle hardware video decoding on/off (useful for troubleshooting)
# The OSD will show "Using hardware decoding" or "Using software decoding".

Ctrl+h cycle-values hwdec "auto" "no"